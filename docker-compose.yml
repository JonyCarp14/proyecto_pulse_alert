
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pulsealert_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulsealert_dev}
      POSTGRES_DB: ${DB_NAME:-pulsealert_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pulsealert_user} -d ${DB_NAME:-pulsealert_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pulsealert_user}
      DB_PASSWORD: ${DB_PASSWORD:-pulsealert_dev}
      DB_NAME: ${DB_NAME:-pulsealert_db}
      SECRET_KEY: ${SECRET_KEY:-solo-para-desarrollo}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
